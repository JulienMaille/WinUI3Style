# CI gate for WinUI3Style.
#
# Baseline refresh procedure (never auto-accept):
#   1. Build Release and run the gallery capture locally:
#      build\src\gallery\Release\winui3style_gallery.exe --capture-dir <absolute-dir>
#   2. Review every PNG diff pixel-by-pixel against tests/baselines/gallery
#      (tools/compare_images.py --diff diff.png reports RMS, differing-pixel
#      count, max delta, bounding box; RMS is a regression signal, geometry
#      and state semantics are the acceptance criterion per docs/METHODOLOGY.md).
#   3. Commit the new approved PNGs. A red baseline is debugged from the
#      uploaded snapshot-report.json + capture artifacts, never by
#      re-running until green.
#
# After merge: enable GitHub branch protection requiring the msvc-gate job
# green on PRs (manual repo-settings step; not automatable from the tree).
#
# Tests labelled native are excluded from the hosted
# gate: they need an interactive desktop (QT_QPA_PLATFORM=windows, real
# focus/compositor) and can only report skipped/blocked on a headless runner.
# They keep LABELS native;interactive in tests/CMakeLists.txt and run on
# self-hosted runners or manual dispatch.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Five CI runs were queued at once in run 44885729876: at 9 jobs each they
# blew through the 20-job free-tier concurrency cap, so jobs waited 2m46s-
# 14m46s for a runner before doing any work. A superseded branch/PR run can
# never become the merged state, so cancel it and hand its slots to the
# current commit. Let running main checks finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qt65-library:
    name: Library build at Qt 6.5 minimum
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.5.3'
          host: linux
          target: desktop
          arch: gcc_64
          archives: qtbase
          cache: true
      - run: cmake -S . -B build -DWINUI_ENABLE_TESTS=OFF -DWINUI3STYLE_BUILD_DEMO=OFF -DCMAKE_REQUIRE_FIND_PACKAGE_Qt6=ON
      - run: cmake --build build --target winui3style --parallel 2

  coverage-honesty:
    # A Verified row must name at least one test *function* that exists under
    # tests/ (matched as `void ...::name(`), so a bare class or file mention
    # cannot stand in for evidence. The old tripwire ("the diff also touches
    # tests/") false-redded main: a live pass is recorded after the PR merge,
    # so the promotion often lands in its own docs-only commit. Checking the
    # evidence column is the real claim, works for both PR and push events,
    # and still fails a promotion that names nothing. The semantic honesty
    # stays reviewer-owned; this is a tripwire, not a proof of live evidence
    # (METHODOLOGY §6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Qt distribution notice extraction
        run: python3 tools/test_extract_qt_notices.py
      - name: Require tests alongside Verified promotions
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          rows=$(git diff --unified=0 "$base"...HEAD -- docs/coverage.md \
                   | grep '^+.*| *Verified' || true)
          if [ -z "$rows" ]; then
            echo "no Verified promotions in $base...HEAD"
            exit 0
          fi
          missing=0
          while IFS= read -r row; do
            cited=0
            for name in $(printf '%s\n' "$row" | grep -oE '`[^`]+`' | tr -d '`' \
                            | grep -oE '^[A-Za-z_][A-Za-z0-9_]*$'); do
              if grep -rqE "void[[:space:]]+([A-Za-z0-9_]+::)?${name}[[:space:]]*\(" tests/; then
                echo "promoted row cites existing test: $name"
                cited=1
                break
              fi
            done
            if [ "$cited" -eq 0 ]; then
              echo "::error::coverage.md marks a row Verified without naming a test that exists under tests/. Tests alone never promote to Verified (METHODOLOGY §6); add evidence + tests or keep source-audited: $(printf '%s' "$row" | cut -c1-140)"
              missing=1
            fi
          done <<< "$rows"
          exit "$missing"

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format whole tree
        run: |
          pip install "clang-format==18.1.8"
          clang-format --dry-run --Werror $(git ls-files src tests | grep -E '\.(cpp|h)$')

  clang-tidy:
    # Minimal mechanical gate (5 checks, warnings are errors): runs on
    # ubuntu where apt's clang-tidy + Qt6 are available. MSVC stays the
    # compiler gate above; this job only lints shipped code (library,
    # plugin, gallery) via -DWINUI3STYLE_CLANG_TIDY=ON. Tests/benchmarks
    # are excluded from tidy by design (QtTest idioms).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: 'qt-6.8.3-linux-gcc64-v1'
      - name: Configure (tidy on, tests/benchmarks off)
        run: >
          cmake -S . -B build-tidy
          -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6"
          -DWINUI3STYLE_BUILD_PLUGIN=ON
          -DWINUI3STYLE_BUILD_DEMO=ON
          -DWINUI_ENABLE_TESTS=OFF
          -DWINUI3STYLE_BUILD_BENCHMARKS=OFF
          -DWINUI3STYLE_CLANG_TIDY=ON
      - name: Build (tidy runs as errors)
        run: cmake --build build-tidy -j"$(nproc)"

  clazy:
    name: clazy (Qt 6.8.3, experimental)
    # Experiment: the Qt C++ review skill v3.1 check set, run as a report only
    # (continue-on-error) so it cannot block a merge while we learn what it
    # says about this tree. Ubuntu's clazy 1.11 (clang 15) parses the
    # GCC-built Qt database; the Windows host's MSVC STL needs clang 20+, so
    # this cannot run locally. A later promotion would make it a real gate.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clazy
        run: |
          sudo apt-get update
          sudo apt-get install -y clazy
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: 'qt-6.8.3-linux-gcc64-v1'
      - name: Configure (compile database, no tidy launcher)
        run: >
          cmake -S . -B build-clazy
          -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DWINUI3STYLE_BUILD_PLUGIN=ON
          -DWINUI3STYLE_BUILD_DEMO=ON
          -DWINUI_ENABLE_TESTS=OFF
          -DWINUI3STYLE_BUILD_BENCHMARKS=OFF
      - name: Build (generates ui_gallerywindow.h for the gallery TU)
        run: cmake --build build-clazy -j"$(nproc)"
      - name: Run clazy over shipped sources
        env:
          CLAZY_HEADER_FILTER: '.*WinUI3Style/src/.*'
        run: |
          # The skill's clazy-checks.txt minus qt6-deprecated-api-fixes and
          # qt6-header-fixes: Ubuntu's clazy 1.11 rejects both as invalid.
          checks='level0,level1,old-style-connect,missing-qobject-macro,copyable-polymorphic,use-chrono-in-qtimer,use-static-qregularexpression,assert-with-side-effects,isempty-vs-count,reserve-candidates,container-inside-loop,thread-with-slots'
          mapfile -t files < <(find src/lib src/plugin src/gallery -name '*.cpp' | sort)
          clazy-standalone -p build-clazy -checks="$checks" \
            --extra-arg=-Wno-unknown-warning-option \
            --extra-arg=-Wno-error \
            --extra-arg=-UQT_NO_DEBUG \
            "${files[@]}" 2>&1 | tee clazy-report.txt
          echo "clazy warning lines: $(grep -c 'warning:' clazy-report.txt || true)"
      - name: Upload clazy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clazy-report
          path: clazy-report.txt
          if-no-files-found: warn

  linux-gcc:
    name: linux-gcc (Qt 6.8.3, Release)
    # Compilation and unit-test gate for non-Windows hosts (issue #21). The
    # tree is portable Qt: the backdrop, appearance-watcher, and native capture
    # paths are compiled out by Q_OS_WIN. Native tests are excluded because
    # they need an interactive Windows desktop and DWM. The gallery snapshot
    # matrix is not registered off Windows at all, because
    # tests/baselines/gallery is the pinned Windows raster (Segoe UI, Fluent
    # glyphs) and Linux font substitution would fail it for reasons that are
    # not regressions; its oracle, winui3style_image_comparison_contract, is
    # portable and does run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: 'qt-6.8.3-linux-gcc64-v1'
      - name: Install Python, Pillow, and a fallback UI font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow
      - name: Configure
        run: >
          cmake -S . -B build-linux
          -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6"
          -DCMAKE_BUILD_TYPE=Release
          -DWINUI3STYLE_BUILD_PLUGIN=ON
          -DWINUI3STYLE_BUILD_DEMO=ON
          -DWINUI_ENABLE_TESTS=ON
          -DWINUI3STYLE_WARNINGS_AS_ERRORS=ON
          -DWINUI3STYLE_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build-linux -j"$(nproc)"
      - name: Test (exclude interactive native tests)
        # Every registered test here is an independent process writing its own
        # *_unit.txt; the RUN_SERIAL snapshot matrix is Windows-only.
        run: >
          ctest --test-dir build-linux --output-on-failure -LE native -j 2
      - name: Benchmark harness self-test
        run: python3 tools/test_perf_compare.py
      - name: Compare render cost with Fusion (ratio ceiling)
        # Budget ceiling, not a baseline gate: run the render benchmark with
        # WinUI3Style and Fusion in the same offscreen process type on the same
        # runner, and fail only when a gated scene's p50 exceeds a fixed
        # multiple of Fusion's (runner speed cancels out in the ratio). This
        # catches paint regressions while never gating the snapshot red/green
        # path (AGENTS.md: benchmarks stay opt-in; this step is the deliberate
        # exception). The whole comparison runs in seconds;
        # the ceiling lives in tools/perf_compare.py --max-ratio. Raise it when
        # a documented change moves the standing ratio, never by re-running
        # until green.
        run: >
          python3 tools/perf_compare.py
          --binary build-linux/tests/benchmarks/winui3style_render_benchmark
          --rows=10000 --iterations=40 --max-ratio 1.5
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-log
          path: |
            build-linux/Testing/Temporary/LastTest.log
            build-linux/Testing/Temporary/LastTestsFailed.log
            build-linux/tests/*_unit.txt
          if-no-files-found: warn
      - name: Consumer configuration without the test suite
        # A host project embedding the style must be able to opt out of tests
        # with one switch, without Qt::Test or Pillow (issue #21 item 1).
        run: |
          cmake -S . -B build-consumer \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWINUI_ENABLE_TESTS=OFF \
            -DWINUI3STYLE_BUILD_DEMO=OFF
          cmake --build build-consumer -j"$(nproc)"
          # No test binary, no CTest registration, no Python requirement.
          test ! -d build-consumer/tests
          test ! -f build-consumer/CTestTestfile.cmake
      - name: Legacy WINUI3STYLE_BUILD_TESTS spelling still works
        run: |
          cmake -S . -B build-legacy \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWINUI3STYLE_BUILD_TESTS=OFF \
            -DWINUI3STYLE_BUILD_DEMO=OFF
          test ! -d build-legacy/tests

  windows-msvc:
    # windows-2022 ships VS17 + its setup instance; windows-latest moved on and
    # CMake's "Visual Studio 17 2022" generator can no longer find VS there.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # 6.8.3 = oldest supported Qt; 6.12.1 = version this tree develops
        # against. Exact versions: stock aqt 3.3.x has no checksum entry for
        # newer Qt 6.11+ Windows archives, so the pinned action + dev snapshot
        # below is required (not "any v4").
        qt: ["6.8.3", "6.12.1"]
        # Debug is a multi-config drift guard, not a PR signal: in run
        # 44885729876 its test step cost 6m36s (6.8.3) and 8m56s (6.12) versus
        # 3m40s in Release; the gallery capture alone carries a 600 s Debug
        # timeout (tests/CMakeLists.txt). PRs gate both supported Qt versions
        # in Release; main and manual dispatch run the full matrix so Debug
        # deployment still cannot drift unnoticed.
        configuration: ${{ fromJSON(github.event_name == 'pull_request' && '["Release"]' || '["Debug", "Release"]') }}
    env:
      QT_VERSION: ${{ matrix.qt }}
      QT_ARCH: win64_msvc2022_64
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
    steps:
      - uses: actions/checkout@v7
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          cache-key-prefix: 'qt-${{ env.QT_VERSION }}-aqt-16db45a-v1'
          # aqtinstall 3.3.x has no checksum entry for the Qt 6.11+ Windows
          # archives yet; use the tested checksum-enabled development snapshot.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - name: Install Python + Pillow
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Prepare Windows 11 visual test font
        shell: pwsh
        run: ./tools/setup_visual_test_fonts.ps1
      - name: Configure (${{ matrix.configuration }})
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DWINUI3STYLE_BUILD_PLUGIN=ON
          -DWINUI3STYLE_BUILD_DEMO=ON
          -DWINUI_ENABLE_TESTS=ON
          -DWINUI3STYLE_WARNINGS_AS_ERRORS=ON
          -DWINUI3STYLE_BUILD_BENCHMARKS=ON
      - name: Build
        # Match the four cores on the hosted Windows runner.
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 4
      - name: Smoke-test clean installation with a Qt-only client
        shell: pwsh
        run: ./tools/install_smoke.ps1 -BuildDir build -Configuration $env:BUILD_CONFIGURATION
      - name: Enable animation effects for the motion contracts
        shell: pwsh
        run: |
          # Hosted runners commonly report client-area animation off. The style
          # now honours that preference (#52), but the motion tests and gallery
          # baselines assert animated frames, so opt this ephemeral session in.
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class WinUI3AnimationSetting {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern bool SystemParametersInfoW(uint action, uint param, IntPtr value, uint flags);
          }
          "@
          if (-not [WinUI3AnimationSetting]::SystemParametersInfoW(0x1043, 0, [IntPtr]1, 0)) {
            throw "SPI_SETCLIENTAREAANIMATION failed"
          }
      - name: Test (exclude interactive native tests)
        shell: pwsh
        run: |
          # -V streams QtTest PASS/FAIL lines into the job log; without it a
          # crash and an assertion look identical (empty LastTest.log output).
          # Tee to a file because Select-Object -Last truncates the FAIL! lines
          # we need; the next step greps the full log.
          # -j 2: the snapshot matrix is RUN_SERIAL and native tests are
          # excluded by -LE native, so independent unit binaries can share the
          # 4-core runner without contending for shared state.
          ctest --test-dir build -C $env:BUILD_CONFIGURATION --output-on-failure -V -LE native -j 2 2>&1 |
            Tee-Object -FilePath ctest-verbose.log | Select-Object -Last 30
      - name: Compare render cost with Fusion (ratio ceiling)
        # Same budget ceiling as the linux-gcc job: see that step for the
        # rationale and the threshold-change policy. Qt ships the offscreen
        # platform plugin on Windows too, and tools/perf_compare.py selects
        # it, so both styles are measured in the same process type.
        shell: pwsh
        run: >
          python3 tools/perf_compare.py
          --binary build/tests/benchmarks/${{ matrix.configuration }}/winui3style_render_benchmark.exe
          --rows=10000 --iterations=40 --max-ratio 1.5
      - name: Show failing assertions
        if: failure()
        shell: pwsh
        run: |
          # The step above only echoes the last 30 lines, which hides which
          # assertion failed. The full -V stream is in ctest-verbose.log, so
          # print the failure contexts from it here.
          if (-not (Test-Path ctest-verbose.log)) {
            Write-Output 'no ctest-verbose.log was written'
            exit 0
          }
          Select-String -Path ctest-verbose.log -Pattern 'FAIL!|Received signal|Totals:' -Context 3,3 |
            Select-Object -First 40 | Out-String -Width 400
      - name: Rerun failed binaries with QtTest -v2
        if: failure()
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_PLUGIN_PATH = "$PWD/build/plugins"
          $env:QT_QPA_FONTDIR = "$env:SystemRoot/Fonts"
          $config = $env:BUILD_CONFIGURATION
          foreach ($t in @('winui3style_icons_tests', 'winui3style_menus_tests', 'winui3style_editors_tests', 'winui3style_dialogs_tests')) {
            Write-Output "===== $t per-function ====="
            $funcs = & "build/tests/$config/$t.exe" -functions 2>&1
            $listCode = $LASTEXITCODE
            Write-Output "$t::-functions exit: $listCode"
            if ($listCode -ne 0) {
                $funcs | Out-File "$t-startup.log"
                continue
            }
            foreach ($f in $funcs) {
                $name = $f -replace '[()]', ''
                if ($name -match '^(initTestCase|cleanupTestCase|init|cleanup)$') { continue }
                & "build/tests/$config/$t.exe" -v2 $name > "$t-$name.log" 2>&1
                $code = $LASTEXITCODE
                Write-Output "$t::$name exit: $code"
                Select-String -Path "$t-$name.log" -Pattern 'FAIL!|Totals|Received signal' |
                  Select-Object -First 6
            }
          }
      - name: Upload snapshot debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-debug-${{ matrix.qt }}-${{ matrix.configuration }}
          path: |
            build/snapshot-report.json
            build/snapshot-captures/
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/tests/*_unit.txt
            ctest-verbose.log
            ./*-*.log
          if-no-files-found: warn

  windows-mingw:
    name: windows-mingw (Qt 5.12.12, Release)
    # Qt 5.12 MinGW must at least build. No snapshot/DPI gate here;
    # offscreen fidelity and Pillow matrix belong to the MSVC job above.
    # Toolchain match: install-qt-action defaults to the runner's own
    # C:/mingw64 (GCC 15 64-bit), which cannot link Qt 5.12's 32-bit MinGW 7.3
    # binaries. tools_win32_mingw730 puts the period-correct g++/mingw32-make
    # on PATH so CMake picks it (verified: GNU 7.3.0, "MinGW Makefiles").
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt 5.12 (MinGW 7.3 32-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.12.12"
          arch: win32_mingw73
          tools: tools_mingw,qt.tools.win32_mingw730
          cache: true
      - name: Install Python + Pillow
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Configure (MinGW, benchmarks off)
        shell: cmd
        run: >
          cmake -S . -B build-mingw -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DWINUI3STYLE_BUILD_BENCHMARKS=OFF
          -DWINUI3STYLE_BUILD_NATIVE_TESTS=OFF
      - name: Build
        # MinGW Makefiles are serial without -j; hosted runner has 4 cores.
        run: cmake --build build-mingw --config Release --parallel 2
