name: Paired rich-surface benchmark

on:
  push:
    branches: [codex/measure-rich-table-geometry]

permissions:
  contents: read

jobs:
  windows-qt683:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: 'qt-6.8.3-aqt-16db45a-v1'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare the same fonts as the CI benchmark
        run: ./tools/setup_visual_test_fonts.ps1
      - name: Build matched main and prototype binaries
        shell: pwsh
        run: |
          $src = 'src/lib/winui3style_contracts_p.cpp'
          git checkout 7857c5bb3adbb148d00758ad09e3e8f911f51d74 -- $src
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DWINUI3STYLE_BUILD_PLUGIN=OFF -DWINUI3STYLE_BUILD_DEMO=OFF -DWINUI_ENABLE_TESTS=OFF -DWINUI3STYLE_BUILD_BENCHMARKS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          function Build-AndStage($destination) {
            cmake --build build --config Release --parallel 4 --target winui3style_render_benchmark
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item build/tests/benchmarks/Release/winui3style_render_benchmark.exe $destination
            Copy-Item build/src/lib/Release/winui3style.dll $destination
          }
          Build-AndStage 'before'
          git checkout $env:GITHUB_SHA -- $src
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Build-AndStage 'after'
      - name: Measure rich surface and its three components
        run: python tools/measure_rich_components.py before/winui3style_render_benchmark.exe after/winui3style_render_benchmark.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-rich-measurements
          path: windows-rich-measurements.csv
          if-no-files-found: warn
