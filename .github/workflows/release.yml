name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  QT_VERSION: '6.12.0'

jobs:
  package-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt ${{ env.QT_VERSION }} (same SDK build as CI)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '${{ env.QT_VERSION }}'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: 'qtbase qtsvg qtimageformats'
          cache: true
          cache-key-prefix: 'qt-${{ env.QT_VERSION }}-aqt-16db45a-v1'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - name: Configure Release build
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DQt6_DIR:PATH=$env:QT_ROOT_DIR/lib/cmake/Qt6"
          -DWINUI3STYLE_BUILD_PLUGIN=ON
          -DWINUI3STYLE_BUILD_DEMO=ON
          -DWINUI_ENABLE_TESTS=OFF
          -DWINUI3STYLE_WARNINGS_AS_ERRORS=ON
          -DWINUI3STYLE_BUILD_BENCHMARKS=OFF
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Package Windows gallery
        shell: pwsh
        run: |
          # The packager stages a deployable tree and prints its path last.
          $stage = & ./tools/package_poc.ps1 -BuildDir build -QtRoot $env:QT_ROOT_DIR -SkipTests |
            Select-Object -Last 1
          $stage = $stage.Trim()
          if (-not (Test-Path -LiteralPath $stage -PathType Container)) {
            throw "Packager did not stage a package directory: $stage"
          }
          $archive = Join-Path build "$(Split-Path -Leaf $stage).zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: WinUI3Style-${{ github.ref_name }}-win-x64-qt${{ env.QT_VERSION }}
          path: build/WinUI3Style-*.zip
          if-no-files-found: error
          retention-days: 14

  package-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt ${{ env.QT_VERSION }} for Linux x86_64
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '${{ env.QT_VERSION }}'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: 'qtbase qtsvg qtimageformats'
          cache: true
          cache-key-prefix: 'qt-${{ env.QT_VERSION }}-linux-gcc64-release-v1'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      # The ldd gate below resolves the XCB stack from the host: those libraries
      # are intentionally not bundled, so they must be installed to pass.
      - name: Install host-side XCB runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            patchelf
      # ICU 73.2 matches the runtime the official Qt Linux SDK links against.
      # When QT_VERSION changes, re-verify which ICU the Qt build needs.
      - name: Build ICU 73.2 required by the official Qt Linux SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/icu4c-73_2-src.tgz"
          curl --fail --location --retry 3 \
            https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz \
            --output "$archive"
          source_root="$RUNNER_TEMP/icu"
          build_root="$RUNNER_TEMP/icu-build"
          install_root="$RUNNER_TEMP/icu-install"
          mkdir -p "$source_root" "$build_root"
          tar -xzf "$archive" -C "$source_root" --strip-components=1
          cd "$build_root"
          "$source_root/source/runConfigureICU" Linux \
            --prefix="$install_root" --enable-shared --disable-static
          make --jobs="$(nproc)"
          make install
          test -e "$install_root/lib/libicui18n.so.73"
          echo "ICU73_ROOT=$install_root" >> "$GITHUB_ENV"
          echo "ICU73_SOURCE=$source_root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$install_root/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Package Linux gallery
        run: bash tools/package_linux.sh build-linux "$QT_ROOT_DIR" release-assets --skip-tests
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: WinUI3Style-${{ github.ref_name }}-linux-x64-gcc-qt${{ env.QT_VERSION }}
          path: release-assets/WinUI3Style-*-linux-x64-gcc-qt${{ env.QT_VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [package-windows, package-linux]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: WinUI3Style-${{ github.ref_name }}-*
          merge-multiple: true
          path: release-assets
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File)
          if (-not ($assets | Where-Object Name -Like '*.zip') -or
              -not ($assets | Where-Object Name -Like '*.tar.gz')) {
            throw 'Release artifacts are incomplete.'
          }
          $assetPaths = @($assets.FullName)
          gh release create $env:RELEASE_TAG @assetPaths `
            --title $env:RELEASE_TAG `
            --notes "Prerelease build of WinUI3Style (Qt 6.12.0): Windows x64 and Linux x64 Gallery packages." `
            --prerelease
