name: release

on:
  push:
    tags:
      - 'v0.1.0-experimental.1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the Linux Gallery to the existing prerelease'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.1.0-experimental.1
          fetch-depth: 0
      - name: Check out versioned release tooling separately from the immutable tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: build/release-tools
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6.11.1 (same SDK build as CI)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: 'qtbase qtsvg qtimageformats'
          cache: true
          cache-key-prefix: 'qt-6.11.1-aqt-16db45a-v1'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - name: Install Python and Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Test Qt notice extraction
        run: python build/release-tools/tools/test_extract_qt_notices.py
      - name: Prepare Windows 11 visual test font (not redistributed)
        shell: pwsh
        run: ./tools/setup_visual_test_fonts.ps1
      - name: Verify Qt Windows 11 style plugin is in the SDK
        shell: pwsh
        run: |
          $plugin = Join-Path $env:QT_ROOT_DIR 'plugins/styles/qmodernwindowsstyle.dll'
          if (-not (Test-Path -LiteralPath $plugin -PathType Leaf)) {
            throw "Qt 6.11.1 SDK is missing the required modern Windows style plugin: $plugin"
          }
      - name: Fetch and verify matching official Qt source modules
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '6.11.1'
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'qt-corresponding-source'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'qt-source-downloads'
          New-Item -ItemType Directory -Path $sourceRoot, $downloadRoot -Force | Out-Null
          $modules = @(
            @{ Name = 'qtbase'; Hash = 'd9594a31228aa23ad6b531719a29b45f0f3989fe6c136d45767ea179f233c1ac' },
            @{ Name = 'qtsvg'; Hash = '7f3cf02f4824bf03c2c5859ea6db173bf1482a1daf24e6cdf7bc78cfa26a8a94' },
            @{ Name = 'qtimageformats'; Hash = 'b2bf6c6845ac175ed7f819145483ba4676f617aaa6a5012c8efee63c8bbac413' }
          )
          foreach ($module in $modules) {
            $archiveName = "$($module.Name)-everywhere-src-$version.tar.xz"
            $archivePath = Join-Path $downloadRoot $archiveName
            # Mirrors listed by download.qt.io; retain the original SHA-256
            # gate, and bound each transfer so a dead mirror cannot hang CI.
            $urls = @(
              "https://ftp.fau.de/qtproject/archive/qt/6.11/6.11.1/submodules/$archiveName",
              "https://mirror.accum.se/mirror/qt.io/qtproject/archive/qt/6.11/6.11.1/submodules/$archiveName"
            )
            $downloaded = $false
            foreach ($url in $urls) {
              Write-Host "Downloading $archiveName from $url"
              & "$env:SystemRoot/System32/curl.exe" --fail --location --silent --show-error `
                --connect-timeout 15 --max-time 120 --output $archivePath $url
              if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
              Write-Warning "Mirror failed for $archiveName (curl exit $LASTEXITCODE)."
            }
            if (-not $downloaded) { throw "All bounded downloads failed for $archiveName" }
            $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $module.Hash) {
              throw "SHA-256 mismatch for ${archiveName}: $actualHash"
            }
            Write-Host "Verified $archiveName ($((Get-Item -LiteralPath $archivePath).Length) bytes)."
            $extractRoot = Join-Path $sourceRoot $module.Name
            New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
            Write-Host "Extracting required notices from $archiveName into $extractRoot"
            python build/release-tools/tools/extract_qt_notices.py $archivePath $extractRoot
            if ($LASTEXITCODE -ne 0) { throw "Cannot extract notices from $archiveName" }
            if (-not (Test-Path -LiteralPath (Join-Path $extractRoot 'LICENSES') -PathType Container)) {
              throw "Expected source license directory missing: $extractRoot"
            }
            Write-Host "Prepared source module $($module.Name)"
          }
      - name: Configure Release build
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DQt6_DIR:PATH=$env:QT_ROOT_DIR/lib/cmake/Qt6"
          -DWINUI3STYLE_BUILD_PLUGIN=ON
          -DWINUI3STYLE_BUILD_DEMO=ON
          -DWINUI3STYLE_BUILD_TESTS=ON
          -DWINUI3STYLE_BUILD_NATIVE_TESTS=ON
          -DWINUI3STYLE_WARNINGS_AS_ERRORS=ON
          -DWINUI3STYLE_BUILD_BENCHMARKS=OFF
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Run hosted-compatible Release tests and package
        shell: pwsh
        run: |
          ./tools/package_poc.ps1 -BuildDir build `
            -QtRoot $env:QT_ROOT_DIR `
            -QtSourceRoot (Join-Path $env:RUNNER_TEMP 'qt-corresponding-source') `
            -ExcludeNativeTests `
            -ReleaseSuffix experimental.1
          $candidate = Get-ChildItem -Path build/poc -Recurse -File `
            -Filter '*-win-x64-msvc-qt6.11.1-experimental.1.zip' |
            Select-Object -First 1
          if (-not $candidate) { throw 'Packager did not produce the Gallery ZIP.' }
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item -LiteralPath $candidate.FullName -Destination $assets
          Copy-Item -LiteralPath ($candidate.FullName + '.sha256') -Destination $assets
          $downloads = Join-Path $env:RUNNER_TEMP 'qt-source-downloads'
          foreach ($archive in Get-ChildItem -LiteralPath $downloads -File -Filter '*.tar.xz') {
            Copy-Item -LiteralPath $archive.FullName -Destination $assets
          }
          $sourceInfo = Get-ChildItem -LiteralPath $assets -File -Filter 'qt*-everywhere-src-6.11.1.tar.xz' |
            Sort-Object Name | ForEach-Object {
              [ordered]@{ file = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            }
          [ordered]@{
            qtVersion = '6.11.1'
            source = 'Official Qt Project source archives, verified against Qt download SHA-256 values.'
            modules = @($sourceInfo)
            build = 'Windows x64, MSVC 2022, official Qt binary SDK; native-labelled tests excluded on hosted runner.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $assets 'Qt-6.11.1-source-manifest.json') -Encoding utf8
          $sumLines = @(Get-ChildItem -LiteralPath $assets -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          })
          Set-Content -LiteralPath (Join-Path $assets 'SHA256SUMS.txt') -Value $sumLines -Encoding ascii
      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinUI3Style-v0.1.0-experimental.1-win-x64-qt6.11.1
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

  package-linux:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      # On tag pushes, github.sha is the tagged source. On workflow_dispatch,
      # it is the explicitly selected source revision used to extend the
      # existing experimental release with the Linux build.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Qt 6.11.1 for Linux x86_64
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: 'qtbase qtsvg qtimageformats'
          cache: true
          cache-key-prefix: 'qt-6.11.1-linux-gcc64-release-v1'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host-side XCB runtime prerequisites for deployment checks
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install Pillow for the snapshot oracle
        run: python3 -m pip install pillow
      - name: Download verified Qt corresponding-source inputs
        uses: actions/download-artifact@v4
        with:
          name: WinUI3Style-v0.1.0-experimental.1-win-x64-qt6.11.1
          path: qt-source-assets
      - name: Package and smoke-test Linux Gallery
        run: |
          bash tools/package_linux.sh build-linux "$QT_ROOT_DIR" qt-source-assets release-assets
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: WinUI3Style-v0.1.0-experimental.1-linux-x64-gcc-qt6.11.1
          path: |
            release-assets/WinUI3Style-0.1.0-linux-x64-gcc-qt6.11.1-experimental.1.tar.gz
            release-assets/WinUI3Style-0.1.0-linux-x64-gcc-qt6.11.1-experimental.1.tar.gz.sha256
            release-assets/WinUI3Style-0.1.0-linux-x64-gcc-qt6.11.1-experimental.1-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [package, package-linux]
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.1.0-experimental.1
          fetch-depth: 0
      - name: Check out release notes for the selected workflow revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          sparse-checkout: RELEASE_NOTES.md
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: WinUI3Style-v0.1.0-experimental.1-*
          merge-multiple: true
          path: release-assets
      - name: Publish new release or append Linux assets to existing prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-experimental.1
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File)
          $linuxAssets = @($assets | Where-Object Name -Like '*linux-x64-gcc*')
          if ($linuxAssets.Count -ne 3) { throw 'Linux release assets are incomplete.' }
          $linuxArchive = $linuxAssets | Where-Object Name -Like '*.tar.gz'
          $linuxChecksum = $linuxAssets | Where-Object Name -Like '*.tar.gz.sha256'
          $linuxManifest = $linuxAssets | Where-Object Name -Like '*-manifest.json'
          if (-not $linuxArchive -or -not $linuxChecksum -or -not $linuxManifest) {
            throw 'Linux archive, detached checksum, or manifest is missing.'
          }
          $claimed = (Get-Content -LiteralPath $linuxChecksum.FullName -Raw).Trim() -split '\s+'
          $actual = (Get-FileHash -LiteralPath $linuxArchive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($claimed[0] -ne $actual -or $claimed[-1] -ne $linuxArchive.Name) {
            throw 'Linux archive checksum does not match its detached checksum file.'
          }
          $manifestData = Get-Content -LiteralPath $linuxManifest.FullName -Raw | ConvertFrom-Json
          if ($manifestData.name -ne 'WinUI3Style-0.1.0-linux-x64-gcc-qt6.11.1-experimental.1') {
            throw 'Linux release manifest identifies an unexpected package.'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $downloadDir = Join-Path $env:RUNNER_TEMP 'existing-release'
            New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
            gh release download $env:RELEASE_TAG --pattern SHA256SUMS.txt --dir $downloadDir
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the existing release checksums.' }
            $sumLines = @(Get-Content -LiteralPath (Join-Path $downloadDir 'SHA256SUMS.txt'))
            $sumFile = Join-Path 'release-assets' 'SHA256SUMS.txt'
          } else {
            $sumLines = @(Get-Content -LiteralPath (Join-Path 'release-assets' 'SHA256SUMS.txt'))
            $sumFile = Join-Path 'release-assets' 'SHA256SUMS.txt'
          }
          foreach ($asset in $linuxAssets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $assetSuffix = "  $([regex]::Escape($asset.Name))$"
            $sumLines = @($sumLines | Where-Object { $_ -notmatch $assetSuffix })
            $sumLines += "$hash  $($asset.Name)"
          }
          Set-Content -LiteralPath $sumFile -Value $sumLines -Encoding ascii
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $upload = @($linuxAssets | ForEach-Object FullName) + @($sumFile)
            gh release upload $env:RELEASE_TAG @upload --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not attach Linux assets to the existing prerelease.' }
            gh release edit $env:RELEASE_TAG --notes-file release-tools/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the existing prerelease notes.' }
          } else {
            if ($assets.Count -lt 8) { throw 'Release assets are incomplete.' }
            $allPaths = @($assets | ForEach-Object FullName)
            gh release create $env:RELEASE_TAG @allPaths `
              --title $env:RELEASE_TAG `
              --notes-file RELEASE_NOTES.md `
              --prerelease
          }
