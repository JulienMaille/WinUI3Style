name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt SDK version to build and package (pinned source hashes must exist for it)'
        type: string
        default: '6.12.0'
      publish:
        description: 'Attach the Linux Gallery to the existing prerelease'
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: ${{ inputs.qt_version || '6.12.0' }}

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt ${{ env.QT_VERSION }} (same SDK build as CI)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '${{ env.QT_VERSION }}'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: 'qtbase qtsvg qtimageformats'
          cache: true
          cache-key-prefix: 'qt-${{ env.QT_VERSION }}-aqt-16db45a-v1'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - name: Install Python and Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Prepare Windows 11 visual test font (not redistributed)
        shell: pwsh
        run: ./tools/setup_visual_test_fonts.ps1
      - name: Verify Qt Windows 11 style plugin is in the SDK
        shell: pwsh
        run: |
          $plugin = Join-Path $env:QT_ROOT_DIR 'plugins/styles/qmodernwindowsstyle.dll'
          if (-not (Test-Path -LiteralPath $plugin -PathType Leaf)) {
            throw "Qt $env:QT_VERSION SDK is missing the required modern Windows style plugin: $plugin"
          }
      - name: Fetch official Qt source modules
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:QT_VERSION
          $versionPrefix = ($version -split '\.')[0,1] -join '.'
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'qt-corresponding-source'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'qt-source-downloads'
          New-Item -ItemType Directory -Path $sourceRoot, $downloadRoot -Force | Out-Null
          # Official Qt corresponding sources are downloaded for notice extraction.
          $modules = @('qtbase', 'qtsvg', 'qtimageformats')
          foreach ($module in $modules) {
            $archiveName = "$module-everywhere-src-$version.tar.xz"
            $archivePath = Join-Path $downloadRoot $archiveName
            $urls = @(
              "https://ftp.fau.de/qtproject/archive/qt/$versionPrefix/$version/submodules/$archiveName",
              "https://mirror.accum.se/mirror/qt.io/qtproject/archive/qt/$versionPrefix/$version/submodules/$archiveName"
            )
            $downloaded = $false
            foreach ($url in $urls) {
              Write-Host "Downloading $archiveName from $url"
              & "$env:SystemRoot/System32/curl.exe" --fail --location --silent --show-error `
                --connect-timeout 15 --max-time 120 --output $archivePath $url
              if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
              Write-Warning "Mirror failed for $archiveName (curl exit $LASTEXITCODE)."
            }
            if (-not $downloaded) { throw "All bounded downloads failed for $archiveName" }
            Write-Host "Verified $archiveName ($((Get-Item -LiteralPath $archivePath).Length) bytes)."
            $extractRoot = Join-Path $sourceRoot $module
            New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
            Write-Host "Extracting required notices from $archiveName into $extractRoot"
            python tools/extract_qt_notices.py $archivePath $extractRoot
            if ($LASTEXITCODE -ne 0) { throw "Cannot extract notices from $archiveName" }
            if (-not (Test-Path -LiteralPath (Join-Path $extractRoot 'LICENSES') -PathType Container)) {
              throw "Expected source license directory missing: $extractRoot"
            }
            Write-Host "Prepared source module $module"
          }
      - name: Configure Release build
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DQt6_DIR:PATH=$env:QT_ROOT_DIR/lib/cmake/Qt6"
          -DWINUI3STYLE_BUILD_PLUGIN=ON
          -DWINUI3STYLE_BUILD_DEMO=ON
          -DWINUI3STYLE_BUILD_TESTS=ON
          -DWINUI3STYLE_BUILD_NATIVE_TESTS=ON
          -DWINUI3STYLE_WARNINGS_AS_ERRORS=ON
          -DWINUI3STYLE_BUILD_BENCHMARKS=OFF
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Run hosted-compatible Release tests and package
        shell: pwsh
        run: |
          ./tools/package_poc.ps1 -BuildDir build `
            -QtRoot $env:QT_ROOT_DIR `
            -QtSourceRoot (Join-Path $env:RUNNER_TEMP 'qt-corresponding-source') `
            -ExcludeNativeTests `
            -SkipTests `
            -ReleaseSuffix ''
          $candidate = Get-ChildItem -Path build/poc -Recurse -File `
            -Filter "*-win-x64-msvc-qt$($env:QT_VERSION).zip" |
            Select-Object -First 1
          if (-not $candidate) { throw 'Packager did not produce the Gallery ZIP.' }
          $gallery = Join-Path $env:RUNNER_TEMP 'gallery-assets'
          New-Item -ItemType Directory -Path $gallery -Force | Out-Null
          Copy-Item -LiteralPath $candidate.FullName -Destination $gallery
          Copy-Item -LiteralPath ($candidate.FullName + '.sha256') -Destination $gallery
          $sources = Join-Path $env:RUNNER_TEMP 'source-assets'
          New-Item -ItemType Directory -Path $sources -Force | Out-Null
          $downloads = Join-Path $env:RUNNER_TEMP 'qt-source-downloads'
          foreach ($archive in Get-ChildItem -LiteralPath $downloads -File -Filter '*.tar.xz') {
            Copy-Item -LiteralPath $archive.FullName -Destination $sources
          }
          $sourceInfo = Get-ChildItem -LiteralPath $sources -File -Filter "qt*-everywhere-src-$($env:QT_VERSION).tar.xz" |
            Sort-Object Name | ForEach-Object {
              [ordered]@{ file = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            }
          [ordered]@{
            qtVersion = "$env:QT_VERSION"
            source = 'Official Qt Project source archives, verified against Qt download SHA-256 values.'
            modules = @($sourceInfo)
            build = 'Windows x64, MSVC 2022, official Qt binary SDK; native-labelled tests excluded on hosted runner.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $sources "Qt-$($env:QT_VERSION)-source-manifest.json") -Encoding utf8
      - name: Upload Windows gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinUI3Style-${{ github.ref_name }}-win-x64-qt${{ env.QT_VERSION }}-gallery
          path: ${{ runner.temp }}/gallery-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Qt source archives
        uses: actions/upload-artifact@v4
        with:
          name: WinUI3Style-${{ github.ref_name }}-win-x64-qt${{ env.QT_VERSION }}-sources
          path: ${{ runner.temp }}/source-assets/*
          if-no-files-found: error
          retention-days: 14

  package-linux:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      # On tag pushes, github.sha is the tagged source. On workflow_dispatch,
      # it is the explicitly selected source revision used to extend the
      # existing experimental release with the Linux build.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Qt ${{ env.QT_VERSION }} for Linux x86_64
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '${{ env.QT_VERSION }}'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: 'qtbase qtsvg qtimageformats'
          cache: true
          cache-key-prefix: 'qt-${{ env.QT_VERSION }}-linux-gcc64-release-v1'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host-side XCB runtime prerequisites for deployment checks
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            patchelf xvfb xauth
      # ICU 73.2 matches the runtime the official Qt 6.11.1 Linux SDK links
      # against. When QT_VERSION changes, re-verify which ICU the Qt build needs.
      - name: Build ICU 73.2 required by the official Qt Linux SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/icu4c-73_2-src.tgz"
          curl --fail --location --retry 3 \
            https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz \
            --output "$archive"
          source_root="$RUNNER_TEMP/icu"
          build_root="$RUNNER_TEMP/icu-build"
          install_root="$RUNNER_TEMP/icu-install"
          mkdir -p "$source_root" "$build_root"
          tar -xzf "$archive" -C "$source_root" --strip-components=1
          cd "$build_root"
          "$source_root/source/runConfigureICU" Linux \
            --prefix="$install_root" --enable-shared --disable-static
          make --jobs="$(nproc)"
          make install
          test -e "$install_root/lib/libicui18n.so.73"
          echo "ICU73_ROOT=$install_root" >> "$GITHUB_ENV"
          echo "ICU73_SOURCE=$source_root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$install_root/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Install Pillow for the snapshot oracle
        run: python3 -m pip install pillow
      - name: Download Qt source archives
        uses: actions/download-artifact@v4
        with:
          name: WinUI3Style-${{ github.ref_name }}-win-x64-qt${{ env.QT_VERSION }}-sources
          path: qt-source-assets
      - name: Package and smoke-test Linux Gallery
        run: |
          bash tools/package_linux.sh build-linux "$QT_ROOT_DIR" qt-source-assets release-assets "" 1
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: WinUI3Style-${{ github.ref_name }}-linux-x64-gcc-qt${{ env.QT_VERSION }}
          path: |
            release-assets/WinUI3Style-*-linux-x64-gcc-qt${{ env.QT_VERSION }}.tar.gz
            release-assets/WinUI3Style-*-linux-x64-gcc-qt${{ env.QT_VERSION }}.tar.gz.sha256
            release-assets/WinUI3Style-*-linux-x64-gcc-qt${{ env.QT_VERSION }}-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [package, package-linux]
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: WinUI3Style-${{ github.ref_name }}-*
          merge-multiple: true
          path: release-assets
      - name: Publish new release or append Linux assets to existing prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File)
          $linuxAssets = @($assets | Where-Object Name -Like '*linux-x64-gcc*')
          if ($linuxAssets.Count -lt 2) { throw 'Linux release assets are incomplete.' }
          $linuxArchive = $linuxAssets | Where-Object Name -Like '*.tar.gz'
          $linuxManifest = $linuxAssets | Where-Object Name -Like '*-manifest.json'
          if (-not $linuxArchive -or -not $linuxManifest) {
            throw 'Linux archive or manifest is missing.'
          }
          $manifestData = Get-Content -LiteralPath $linuxManifest.FullName -Raw | ConvertFrom-Json
          $releaseVersion = (Select-String -LiteralPath 'CMakeLists.txt' -Pattern 'project\(WinUI3Style VERSION ([0-9.]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $releaseVersion) { throw 'Cannot identify project version from CMakeLists.txt.' }
          $expectedLinuxName = "WinUI3Style-${releaseVersion}-linux-x64-gcc-qt$($env:QT_VERSION)"
          if ($manifestData.name -ne $expectedLinuxName) {
            throw 'Linux release manifest identifies an unexpected package.'
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $upload = @($linuxAssets | ForEach-Object FullName)
            gh release upload $env:RELEASE_TAG @upload --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not attach Linux assets to the existing prerelease.' }
            gh release edit $env:RELEASE_TAG --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the existing prerelease notes.' }
          } else {
            if ($assets.Count -lt 4) { throw 'Release assets are incomplete.' }
            $allPaths = @($assets | ForEach-Object FullName)
            gh release create $env:RELEASE_TAG @allPaths `
              --title $env:RELEASE_TAG `
              --notes-file RELEASE_NOTES.md `
              --prerelease
          }
